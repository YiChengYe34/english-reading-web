<!DOCTYPE html>
<!-- Underline（/underline/ 子目录）的深层网址：GitHub Pages 找不到文件时会返回这个 404.html，先跳回 Underline 首页并带上原路径，由它还原 -->
<script>(function(){var b='/english-reading-web/underline',l=location;if(l.pathname.indexOf(b+'/')===0&&l.pathname!==b+'/'){l.replace(b+'/?__path='+encodeURIComponent(l.pathname.slice(b.length)+l.search)+l.hash);}})();</script>
<!--
  网页版的页面模板（只有网页版用，手机 APP 不用）。在 Expo 默认模板上加了两处：
  1. 背景色和 APP 一致（#EFE9DE = src/theme/colors.ts 的背景色）
  2. 电脑宽屏上把 APP 限制在居中的手机宽度一栏，不铺满整个屏幕
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>英语精读</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
        background-color: #efe9de;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* 电脑上：居中显示一栏手机宽度 */
      @media (min-width: 600px) {
        #root {
          max-width: 480px;
          margin: 0 auto;
          box-shadow: 0 0 0 1px rgba(27, 33, 48, 0.1);
        }
      }
    </style>
  <link rel="icon" href="/english-reading-web/favicon.ico"/></head>

  <body>
    <noscript>需要打开浏览器的 JavaScript 才能使用。</noscript>
    <div id="root"></div>
  <script src="/english-reading-web/_expo/static/js/web/entry-4413796e71ab7d440fe595004792a379.js" defer></script>
</body>
</html>
